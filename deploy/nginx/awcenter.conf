log_format awcenter_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent request_id=$request_id duration=$request_time';

server {
    listen 80;
    server_name ${AWCENTER_HOST};
    server_tokens off;
    access_log /var/log/nginx/access.log awcenter_safe;
    return 308 https://${AWCENTER_HOST}$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${AWCENTER_HOST};
    server_tokens off;
    access_log /var/log/nginx/access.log awcenter_safe;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 600m;

    location ^~ /media/ {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

# Host-local DOORS runner data plane. Docker publishes this listener only on
# 127.0.0.1; the application token remains mandatory defense in depth.
server {
    listen 8765;
    server_name localhost;
    server_tokens off;
    access_log /var/log/nginx/access.log awcenter_safe;

    client_max_body_size 600m;

    location ^~ /internal/doors-runner/v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host backend;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}

# Container-local aggregate readiness. It avoids disabling TLS verification in
# the healthcheck while remaining unreachable from published ports.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    access_log off;

    location = /nginx-ready {
        proxy_pass http://backend:8000/health/ready/;
        proxy_set_header Host backend;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
