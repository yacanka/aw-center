log_format awcenter_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent request_id=$request_id duration=$request_time';

server {
    listen 8443 ssl;
    server_name ${AWCENTER_BRIDGE_HOST};
    server_tokens off;
    access_log /var/log/nginx/access.log awcenter_safe;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_client_certificate /etc/nginx/tls/bridge-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 600m;

    location ^~ /internal/bridge/v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host backend;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-AWC-mTLS-Verified $ssl_client_verify;
        proxy_set_header X-AWC-mTLS-Cert $ssl_client_escaped_cert;
        proxy_set_header X-AWC-mTLS-Fingerprint "";
        proxy_set_header X-AWC-mTLS-Subject "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}

# This listener is bound to loopback inside the bridge container and validates
# the upstream readiness without weakening the public mTLS listener.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    access_log off;

    location = /nginx-ready {
        proxy_pass http://backend:8000/health/ready/;
        proxy_set_header Host backend;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
