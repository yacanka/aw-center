name: Portable Windows desktop manager

on:
  workflow_dispatch:
  push:
    paths:
      - AWCenterManager.pyw
      - scripts/manager/**
      - scripts/launcher/**
      - scripts/build_manager.py
      - scripts/test_manager*.py
      - scripts/test_launcher*.py
      - packaging/**
      - .github/workflows/manager-windows.yml
      - frontend/package-lock.json
      - requirements.txt
  pull_request:
    paths:
      - AWCenterManager.pyw
      - scripts/manager/**
      - scripts/launcher/**
      - scripts/build_manager.py
      - scripts/test_manager*.py
      - scripts/test_launcher*.py
      - packaging/**
      - .github/workflows/manager-windows.yml
      - frontend/package-lock.json
      - requirements.txt

permissions:
  contents: read

jobs:
  windows-manager:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      AWCENTER_RUN_RUNTIME_PROBE_SMOKE: '1'
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Reproduce the reported system Node version
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26.12.1'
          architecture: x64
      - name: Require a working native Tk display
        run: python -c "import tkinter as tk; root = tk.Tk(); root.update(); root.destroy()"
      - name: Record source manager startup evidence
        run: |
          if not exist "%RUNNER_TEMP%\manager-ui-evidence" mkdir "%RUNNER_TEMP%\manager-ui-evidence"
          python -m scripts.manager.main --smoke-test "%RUNNER_TEMP%\manager-ui-evidence\startup.json"
      - name: Verify system tools, bundle prerequisites and permission diagnostics
        run: python -m unittest scripts.test_launcher_system_python scripts.test_launcher_system_node scripts.test_launcher_runtime_validation scripts.test_launcher_install_dependencies scripts.test_manager_system_tools scripts.test_manager_tool_paths scripts.test_launcher_bundle scripts.test_launcher_env_selection scripts.test_launcher_permissions
      - name: Verify source payload, package and manager contracts
        run: python -m unittest discover -s scripts -p "test_manager*.py"
      - name: Build portable windowed ZIP with reviewed runtime archives
        run: python scripts/build_manager.py --output "%RUNNER_TEMP%\AWCenterManager-windows-x64.zip"
      - name: Extract the complete portable ZIP
        run: python -m zipfile -e "%RUNNER_TEMP%\AWCenterManager-windows-x64.zip" "%RUNNER_TEMP%\awcenter-manager-portable"
      - name: Native packaged window and private worker acceptance
        env:
          AWCENTER_RUN_MANAGER_WINDOWS_SMOKE: '1'
          AWCENTER_MANAGER_EXE: ${{ runner.temp }}\awcenter-manager-portable\AWCenterManager.exe
        run: python -m unittest scripts.test_manager_package.NativeWindowsPackageTests
      - name: Upload manager ZIP and reviewable checksum inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AWCenterManager-windows-x64
          path: |
            ${{ runner.temp }}/AWCenterManager-windows-x64.zip
            ${{ runner.temp }}/AWCenterManager-windows-x64.zip.sha256
            ${{ runner.temp }}/AWCenterManager-windows-x64.zip.inventory.json
          if-no-files-found: error
      - name: Upload manager startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AWCenterManager-ui-evidence
          path: ${{ runner.temp }}/manager-ui-evidence
          if-no-files-found: warn
