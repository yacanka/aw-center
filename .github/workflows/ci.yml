name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: awcenter
          POSTGRES_USER: awcenter
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awcenter -d awcenter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      IPV4_ADDRESS: 127.0.0.1
      PORT: 8000
      DATABASE_URL: postgres://awcenter:ci-database-password@127.0.0.1:5432/awcenter
      CACHE_URL: redis://127.0.0.1:6379/1
      JIRA_ENABLED: "False"
      DOCPROOF_ENABLED: "False"
      DOORS_ENABLED: "False"
      ALLOWED_HOSTS: 127.0.0.1,localhost
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Migrate a fresh PostgreSQL database and verify project seed
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py shell -c "from orgs.models import Project; assert Project.objects.count() == 8"

      - name: Run Django system check
        working-directory: backend
        run: python manage.py check

      - name: Reject missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        working-directory: backend
        run: python manage.py test

      - name: Run launcher regression tests
        run: python -m unittest scripts.test_launcher scripts.test_launcher_jobs scripts.test_release_metadata

      - name: Scan Python dependencies
        run: python -m pip install pip-audit==2.9.0 && pip-audit -r requirements.txt

      - name: Setup Node.js for integrated artifact smoke test
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build immutable frontend artifact
        working-directory: frontend
        run: npm ci && npm run build

      - name: Verify Django serves the built frontend artifact
        working-directory: backend
        run: python manage.py collectstatic --clear --noinput && python manage.py verify_frontend_artifact

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Run strict TypeScript checks
        run: npm run typecheck

      - name: Run frontend regression tests
        run: npm run test:ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Build Vite assets
        run: npm run build
        env:
          VITE_API_URL: /
          VITE_VERSION: ci
          VITE_APP_TITLE: AW Center

      - name: Upload immutable frontend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

      - name: Scan npm dependencies
        run: npm audit --audit-level=high

  python-compatibility:
    name: Python 3.14 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECRET_KEY: ci-compatibility-key
      DEBUG: "True"
      JIRA_ENABLED: "False"
      DOCPROOF_ENABLED: "False"
      DOORS_ENABLED: "False"
      ALLOWED_HOSTS: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - working-directory: backend
        run: python manage.py check && python manage.py test

  container:
    name: Immutable runtime image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: awcenter
          POSTGRES_USER: awcenter
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awcenter -d awcenter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore immutable frontend artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build combined backend and frontend image
        run: >-
          docker buildx build
          --load
          --sbom=true
          --provenance=mode=max
          --metadata-file image-build-metadata.json
          --file backend/Dockerfile
          --tag awcenter:ci
          --build-arg VITE_API_URL=/
          --build-arg VITE_VERSION=ci
          --build-arg VITE_APP_TITLE="AW Center"
          .

      - name: Generate release checksums and dependency SBOM
        run: python scripts/build_release_metadata.py --release "$GITHUB_SHA" --output release-metadata

      - name: Verify image contains the reviewed frontend and record its digest
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create awcenter:ci)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir image-frontend-dist
          docker cp "$container_id:/app/frontend-dist/." image-frontend-dist
          docker rm "$container_id"
          trap - EXIT
          python scripts/verify_release_image.py \
            --image-metadata image-build-metadata.json \
            --release-manifest release-metadata/release-manifest.json \
            --expected-dist frontend/dist \
            --image-dist image-frontend-dist \
            --output release-metadata/image-verification.json

      - name: Bind deployment preflight to release evidence and image digest
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$(mktemp -d)"
          trap 'rm -rf "$evidence_root"' EXIT
          mkdir "$evidence_root/ai-models"
          mkdir "$evidence_root/document-templates"
          printf '%s\n' 'CI certificate placeholder' > "$evidence_root/tls.crt"
          printf '%s\n' 'CI private key placeholder' > "$evidence_root/tls.key"
          chmod 600 "$evidence_root/tls.key"
          image_digest="$(python -c 'import json; print(json.load(open("release-metadata/image-verification.json", encoding="utf-8"))["image_digest"])')"
          AWCENTER_RELEASE="$GITHUB_SHA" \
          AWCENTER_IMAGE="registry.invalid/aw-center@${image_digest}" \
          AWCENTER_HOST=awcenter.internal \
          SECRET_KEY=ci-container-secret-that-is-longer-than-fifty-characters-and-not-production \
          DATABASE_URL=postgres://awcenter:ci-database-password@database:5432/awcenter \
          POSTGRES_PASSWORD=ci-database-password \
          REDIS_PASSWORD=ci-url-safe-redis-password-123 \
          AI_MODEL_DIRECTORY="$evidence_root/ai-models" \
          DOCUMENT_TEMPLATE_DIRECTORY="$evidence_root/document-templates" \
          TLS_CERTIFICATE_FILE="$evidence_root/tls.crt" \
          TLS_PRIVATE_KEY_FILE="$evidence_root/tls.key" \
          DOORS_ENABLED=false \
          python scripts/deployment_preflight.py \
            --release-manifest release-metadata/release-manifest.json \
            --image-verification release-metadata/image-verification.json

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-metadata
          path: |
            release-metadata
            image-build-metadata.json
          if-no-files-found: error

      - name: Smoke fresh schema, readiness, and worker heartbeat
        shell: bash
        run: |
          set -euo pipefail
          redis_password=ci-url-safe-redis-password-123
          docker run -d \
            --name awcenter-ci-auth-redis \
            --publish 6380:6379 \
            --env REDIS_PASSWORD="$redis_password" \
            --user redis \
            redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2 \
            sh -ec 'umask 077; printf "appendonly no\nrequirepass %s\n" "$REDIS_PASSWORD" > /tmp/redis.conf; unset REDIS_PASSWORD; exec redis-server /tmp/redis.conf'
          for attempt in {1..30}; do
            if docker exec -e REDISCLI_AUTH="$redis_password" awcenter-ci-auth-redis redis-cli ping | grep -qx PONG; then break; fi
            sleep 1
          done
          docker exec -e REDISCLI_AUTH="$redis_password" awcenter-ci-auth-redis redis-cli ping | grep -qx PONG
          docker exec awcenter-ci-auth-redis redis-cli ping | grep -q '^NOAUTH'
          runtime_env=(
            -e SECRET_KEY=ci-container-secret-that-is-not-a-production-placeholder
            -e DEBUG=False
            -e ALLOWED_HOSTS=127.0.0.1,localhost,backend
            -e DATABASE_URL=postgres://awcenter:ci-database-password@127.0.0.1:5432/awcenter
            -e CACHE_URL=redis://:${redis_password}@127.0.0.1:6380/1
            -e MODEL_RUNTIME_DIR=/app/ai-models
            -e CUSTOM_TEMPLATE_DIR=/app/document-templates
            -e COVER_PAGE_TEMPLATE_PATH=/app/document-templates/cover_page_template.docx
            -e WORD_TRANSLATION_TR_EN_MODEL=/app/ai-models/opus-mt-tr-en
            -e WORD_TRANSLATION_EN_TR_MODEL=/app/ai-models/opus-mt-en-tr
            -e WORD_ANALYZER_BI_MODEL=/app/ai-models/paraphrase-multilingual
            -e WORD_ANALYZER_CROSS_MODEL=/app/ai-models/ms-marco-cross-encoder
            -e SESSION_COOKIE_SECURE=True
            -e CSRF_COOKIE_SECURE=True
            -e SECURE_SSL_REDIRECT=True
            -e TRUST_PROXY_HEADERS=True
            -e TRUSTED_PROXY_COUNT=1
            -e JIRA_ENABLED=False
            -e DOCPROOF_ENABLED=False
            -e DOORS_ENABLED=False
          )
          docker volume create awcenter-ci-private
          docker volume create awcenter-ci-ai-models
          docker volume create awcenter-ci-document-templates
          trap 'docker rm -f awcenter-web awcenter-worker awcenter-ci-auth-redis >/dev/null 2>&1 || true; docker volume rm awcenter-ci-private awcenter-ci-ai-models awcenter-ci-document-templates >/dev/null 2>&1 || true' EXIT
          docker run --rm --user 0:0 -v awcenter-ci-document-templates:/app/document-templates awcenter:ci python -c "from pathlib import Path; from docx import Document; root=Path('/app/document-templates'); document=Document(); document.add_paragraph('{{ Design_Change_Title }}'); document.save(root/'hys_dcc_template.docx')"
          runtime_volumes=(-v awcenter-ci-private:/app/private_media -v awcenter-ci-ai-models:/app/ai-models:ro -v awcenter-ci-document-templates:/app/document-templates:ro)
          ci_operator_password="$(openssl rand -base64 32)"
          docker run --rm --network host "${runtime_env[@]}" "${runtime_volumes[@]}" awcenter:ci python manage.py migrate --noinput
          docker run --rm --network host "${runtime_env[@]}" "${runtime_volumes[@]}" awcenter:ci python manage.py check --deploy --fail-level WARNING
          docker run --rm --network host "${runtime_env[@]}" "${runtime_volumes[@]}" -e DJANGO_SUPERUSER_USERNAME=ci-release-operator -e DJANGO_SUPERUSER_EMAIL=ci-release-operator@example.invalid -e DJANGO_SUPERUSER_PASSWORD="$ci_operator_password" awcenter:ci python manage.py createsuperuser --noinput
          docker run --rm --network host "${runtime_env[@]}" "${runtime_volumes[@]}" awcenter:ci python manage.py run_release_smoke --stage core --project hys --operator-username ci-release-operator --confirm-fresh-install
          docker run --rm --network host "${runtime_env[@]}" "${runtime_volumes[@]}" -e AWCENTER_MAIL_TRANSPORT=django -e EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend -e DEFAULT_FROM_EMAIL=no-reply@example.invalid awcenter:ci python manage.py run_release_smoke --stage notification --operator-username ci-release-operator --notification-recipient ci-release-canary@example.invalid --confirm-fresh-install
          docker run -d --name awcenter-web --network host "${runtime_env[@]}" "${runtime_volumes[@]}" awcenter:ci
          for attempt in {1..30}; do
            if curl -fsS -H 'Host: 127.0.0.1' -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/ready/; then break; fi
            sleep 1
          done
          curl -fsS -H 'Host: 127.0.0.1' -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/ready/
          docker run -d --name awcenter-worker --network host "${runtime_env[@]}" "${runtime_volumes[@]}" awcenter:ci python manage.py run_job_worker --poll-interval 1 --heartbeat-file /tmp/awcenter-job-worker.id
          for attempt in {1..30}; do
            if docker exec awcenter-worker python manage.py check_job_worker_health --worker-id-file /tmp/awcenter-job-worker.id; then break; fi
            sleep 1
          done
          docker exec awcenter-worker python manage.py check_job_worker_health --worker-id-file /tmp/awcenter-job-worker.id

      - name: Verify runtime source is read-only
        run: >-
          docker run --rm awcenter:ci
          python -c "import os; assert not os.access('/app/manage.py', os.W_OK)"
